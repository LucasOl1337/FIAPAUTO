version: 1
applications:
  - appRoot: apps/web-public
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm ci --include=dev
        build:
          commands:
            - npm run build -w @fiapauto/contracts
            - npm run build -w @fiapauto/web-public
      artifacts:
        baseDirectory: apps/web-public/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - apps/web-public/node_modules/**/*

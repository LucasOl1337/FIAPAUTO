version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --include=dev
        - npm run build -w @fiapauto/contracts
    build:
      commands:
        - npm run build -w @fiapauto/web-public
  artifacts:
    baseDirectory: apps/web-public/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - apps/web-public/node_modules/**/*

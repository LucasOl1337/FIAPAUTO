<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mock Teams Meeting</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Segoe UI, sans-serif;
        background: #201f1e;
        color: #f3f2f1;
      }

      main {
        width: min(560px, 92vw);
        padding: 32px;
        border-radius: 20px;
        background: #2b2a29;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
      }

      button {
        margin-top: 16px;
        padding: 12px 16px;
        border: none;
        border-radius: 999px;
        background: #6264a7;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Microsoft Teams Demo Meeting</h1>
      <p>This fixture simulates a Teams join page for the bot quick test.</p>
      <button type="button" aria-label="Join meeting" onclick="document.body.dataset.joined = 'true'">
        Join meeting
      </button>
    </main>
  </body>
</html>

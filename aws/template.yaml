AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FIAPAUTO public cloud stack

Parameters:
  PublicBucketName:
    Type: String
  LambdaArtifactBucket:
    Type: String
  LambdaArtifactKey:
    Type: String
  ExistingLambdaExecutionRoleArn:
    Type: String
  PublicPrefix:
    Type: String
    Default: fiapauto-public
  FrontendOrigin:
    Type: String

Resources:
  PublicApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - POST
          - OPTIONS
  PublicApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri:
        Bucket: !Ref LambdaArtifactBucket
        Key: !Ref LambdaArtifactKey
      Handler: index.handler
      Runtime: nodejs22.x
      Timeout: 15
      MemorySize: 512
      Role: !Ref ExistingLambdaExecutionRoleArn
      Environment:
        Variables:
          FIAPAUTO_PUBLIC_BUCKET: !Ref PublicBucketName
          FIAPAUTO_AWS_REGION: !Ref AWS::Region
          FIAPAUTO_PUBLIC_PREFIX: !Ref PublicPrefix
      Events:
        Manifest:
          Type: HttpApi
          Properties:
            ApiId: !Ref PublicApi
            Path: /manifest
            Method: GET
        ManifestPrefixed:
          Type: HttpApi
          Properties:
            ApiId: !Ref PublicApi
            Path: /api/public/manifest
            Method: GET
        Topics:
          Type: HttpApi
          Properties:
            ApiId: !Ref PublicApi
            Path: /topics
            Method: GET
        TopicsPrefixed:
          Type: HttpApi
          Properties:
            ApiId: !Ref PublicApi
            Path: /api/public/topics
            Method: GET
        TopicDetail:
          Type: HttpApi
          Properties:
            ApiId: !Ref PublicApi
            Path: /topics/{topicId}
            Method: GET
        TopicDetailPrefixed:
          Type: HttpApi
          Properties:
            ApiId: !Ref PublicApi
            Path: /api/public/topics/{topicId}
            Method: GET
        TopicChat:
          Type: HttpApi
          Properties:
            ApiId: !Ref PublicApi
            Path: /chat/topic
            Method: POST
        TopicChatPrefixed:
          Type: HttpApi
          Properties:
            ApiId: !Ref PublicApi
            Path: /api/public/chat/topic
            Method: POST
        Assets:
          Type: HttpApi
          Properties:
            ApiId: !Ref PublicApi
            Path: /assets
            Method: GET
        AssetsPrefixed:
          Type: HttpApi
          Properties:
            ApiId: !Ref PublicApi
            Path: /api/public/assets
            Method: GET
        SyncStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref PublicApi
            Path: /sync/status
            Method: GET
        SyncStatusPrefixed:
          Type: HttpApi
          Properties:
            ApiId: !Ref PublicApi
            Path: /api/public/sync/status
            Method: GET

Outputs:
  PublicApiUrl:
    Value: !Sub https://${PublicApi}.execute-api.${AWS::Region}.amazonaws.com
  PublicApiBaseUrl:
    Value: !Sub https://${PublicApi}.execute-api.${AWS::Region}.amazonaws.com/api/public
